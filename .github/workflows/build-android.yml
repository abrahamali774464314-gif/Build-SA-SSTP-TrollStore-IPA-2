name: Build SA SSTP Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'example/android/**'
      - 'example/lib/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'example/pubspec.yaml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (compatible Android toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Android APK (test release)
        working-directory: example
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee ../android-build-diagnostic.log

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostic-log
          path: android-build-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload SA SSTP Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA_SSTP_Android_APK
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
